# Julkaisu GitHub Pagesiin: jokainen push main-haaraan tarkistaa ja julkaisee sovelluksen.
# Kertaluonteinen asetus GitHubissa: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Julkaisu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tarkistukset
        run: |
          pnpm lint
          pnpm exec tsc --noEmit
          pnpm test
          pnpm validate-content
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        # Sovelluksen polku Pages-osoitteesta, esim. https://kayttaja.github.io/it-oppi → /it-oppi/
        run: pnpm build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
      # Suorat linkit (esim. /path/linux) toimivat: Pages tarjoaa 404.html:n, joka käynnistää sovelluksen.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
